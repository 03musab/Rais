<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Rais Embroidery Works</title>
    <style>
        :root {
            --primary-color: #800020;
            --secondary-color: #d4af37;
            --bg-color: #fdfbf7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .error-container {
            max-width: 500px;
            padding: 3rem 2rem;
        }

        .error-number {
            font-family: 'Georgia', serif;
            font-size: 8rem;
            color: var(--primary-color);
            margin: 0;
            line-height: 1;
            border-bottom: 4px dashed var(--secondary-color);
            padding-bottom: 1rem;
        }

        .error-title {
            font-family: 'Georgia', serif;
            font-size: 1.8rem;
            color: var(--primary-color);
            margin: 1.5rem 0 0.75rem;
        }

        .error-text {
            color: #666;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .btn {
            display: inline-block;
            padding: 14px 35px;
            border: 2px solid var(--primary-color);
            background: var(--primary-color);
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s ease;
            border-radius: 2px;
        }

        .btn:hover {
            background: var(--secondary-color);
            border-color: var(--secondary-color);
            color: var(--primary-color);
        }
    </style>
</head>

<body>
    <div class="error-container">
        <h1 class="error-number">404</h1>
        <h2 class="error-title">Page Not Found</h2>
        <p class="error-text">The page you're looking for seems to have unraveled. Let us stitch you back to safety.</p>
        <a href="index.html" class="btn">Back to Home</a>
    </div>
    <link rel="stylesheet" href="responsive.css">
    <script src="navbar.js"></script>
</body>

</html>
